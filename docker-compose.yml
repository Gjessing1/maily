# Deploy from /home/gjessing/docker/maily (compose + .env live there).
# Persistent data is bind-mounted from the host at /home/gjessing/data/maily so it survives
# redeploys. That is the system NVMe (nvme0n1p2). The former root /mnt/data/maily lives on a
# second NVMe that began returning unrecoverable media read errors on 2026-08-06; maily was
# restored onto the healthy disk and must not be pointed back at /mnt.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: maily-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MAILY_DATA_DIR: /data
    ports:
      - '3000:3000'
    volumes:
      # Host persistent data (SQLite DB + attachments) -> container /data.
      - /home/gjessing/data/maily:/data
